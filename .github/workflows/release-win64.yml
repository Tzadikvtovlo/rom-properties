name: Build & Release Windows 64-bit

on:
  workflow_dispatch: # הפעלה ידנית בלחיצת כפתור

permissions:
  contents: write

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup gettext and Unix tools
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\Git\usr\bin") {
            "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $hasMsgfmt = Get-Command msgfmt -ErrorAction SilentlyContinue
          $hasXgettext = Get-Command xgettext -ErrorAction SilentlyContinue
          if (-not ($hasMsgfmt -and $hasXgettext)) {
            if ((Test-Path "C:\msys64\usr\bin\msgfmt.exe") -and (Test-Path "C:\msys64\usr\bin\xgettext.exe")) {
              "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install gettext -y --no-progress
            }
          }

      - name: Verify gettext
        shell: pwsh
        run: |
          msgfmt --version
          xgettext --version

      - name: Configure CMake (Win64 Release)
        shell: cmd
        run: |
          cmake -S . -B build -A x64 -DBUILD_TESTING=OFF -DENABLE_LTO=OFF -DENABLE_PCH=ON -DENABLE_EXTRA_SECURITY=ON -DENABLE_JPEG=ON -DENABLE_XML=ON -DENABLE_DECRYPTION=ON -DENABLE_UNICE68=ON -DENABLE_LIBMSPACK=ON -DENABLE_PVRTC=ON -DENABLE_ZSTD=ON -DENABLE_LZ4=ON -DENABLE_LZO=ON -DENABLE_NLS=ON -DENABLE_OPENMP=ON -DENABLE_ASTC=ON

      - name: Build (Win64 Release)
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Package ZIP with CPack
        shell: cmd
        run: |
          cd build
          cpack --version
          cpack -C Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-properties-win64-he
          path: build/*.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zips = @(Get-ChildItem -Path "build\*.zip" | ForEach-Object { $_.FullName })
          if ($zips.Count -eq 0) {
            throw "No .zip file was generated by cpack."
          }
          $tag = "he-win64-b${{ github.run_number }}"
          gh release create $tag @zips `
            --title "rom-properties Hebrew Win64 (Build #${{ github.run_number }})" `
            --notes "Automated Windows 64-bit (Release) build with Hebrew translation."
