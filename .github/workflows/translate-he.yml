name: Auto Translate to Hebrew (Gemini)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          pip install polib requests

      - name: Translate with Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import datetime
          import glob
          import json
          import os
          import time
          import polib
          import requests

          api_key = os.environ["GEMINI_API_KEY"]
          pot_files = glob.glob('locale/*.pot')
          target_path = 'locale/he.po'

          if os.path.exists(target_path):
              po = polib.pofile(target_path)
          elif pot_files:
              po = polib.pofile(pot_files[0])
          else:
              po_files = [f for f in sorted(glob.glob('locale/*.po')) if not f.endswith('he.po')]
              base_file = 'locale/ar.po' if 'locale/ar.po' in po_files else po_files[0]
              po = polib.pofile(base_file)
              for e in po:
                  e.msgstr = ''
                  e.msgstr_plural = {k: '' for k in e.msgstr_plural}

          now_str = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M+0000')
          po.metadata['PO-Revision-Date'] = now_str
          po.metadata['Last-Translator'] = 'Gemini AI'
          po.metadata['Language-Team'] = 'Hebrew'
          po.metadata['Language'] = 'he'
          po.metadata['Plural-Forms'] = 'nplurals=2; plural=(n != 1);'

          tasks = []
          for entry in po:
              if entry.obsolete:
                  continue
              if 'fuzzy' in entry.flags:
                  entry.flags.remove('fuzzy')
              if entry.msgid and not entry.msgstr:
                  tasks.append((entry, False, None, entry.msgid))
              if entry.msgid_plural:
                  if not entry.msgstr_plural.get(0):
                      tasks.append((entry, True, 0, entry.msgid))
                  if not entry.msgstr_plural.get(1):
                      tasks.append((entry, True, 1, entry.msgid_plural))

          MODELS = [
              ("gemini-2.5-flash", {"thinkingBudget": 0}),
              ("gemini-3.6-flash", {"thinkingLevel": "minimal"}),
              ("gemini-3.8-flash", {"thinkingLevel": "low"}),
          ]

          def call_gemini(strings_list):
              prompt = (
                  "Translate the following JSON array of UI strings from English to natural Hebrew "
                  "for a desktop utility that displays metadata of console ROMs and disc images (rom-properties). "
                  "Keep all placeholders (%s, %d, %u, {0}, etc.), escape sequences (\\n, \\t), HTML tags, "
                  "and keyboard mnemonics (& or _) intact. Return ONLY a JSON array of strings of the exact same length.\n\n"
                  + json.dumps(strings_list, ensure_ascii=False)
              )
              last_err = None
              for attempt in range(3):
                  for model, t_cfg in MODELS:
                      url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
                      payload = {
                          "contents": [{"parts": [{"text": prompt}]}],
                          "generationConfig": {
                              "responseMimeType": "application/json",
                              "thinkingConfig": t_cfg,
                          },
                      }
                      try:
                          r = requests.post(
                              url,
                              headers={"x-goog-api-key": api_key, "Content-Type": "application/json"},
                              json=payload,
                              timeout=180,
                          )
                          if r.status_code == 404:
                              continue
                          if r.status_code in (429, 503):
                              print(f"{model} returned HTTP {r.status_code}, trying fallback/retry...")
                              last_err = f"HTTP {r.status_code}: {r.text[:200]}"
                              continue
                          if not r.ok:
                              raise RuntimeError(f"{model} HTTP {r.status_code}: {r.text[:300]}")
                          text = r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                          return json.loads(text)
                      except (requests.exceptions.Timeout, requests.exceptions.ConnectionError, json.JSONDecodeError) as e:
                          print(f"{model} error on attempt {attempt + 1}: {e}")
                          last_err = e
                  time.sleep(15)
              raise RuntimeError(f"Gemini request failed after retries: {last_err}")

          def translate_batch(batch):
              texts = [item[3] for item in batch]
              res = call_gemini(texts)
              if isinstance(res, list) and len(res) == len(batch):
                  return [str(x) for x in res]
              if len(batch) == 1:
                  raise ValueError(f"Invalid response for single item: {res}")
              mid = len(batch) // 2
              print(f"Length mismatch ({len(res)} vs {len(batch)}), splitting batch...")
              time.sleep(5)
              return translate_batch(batch[:mid]) + translate_batch(batch[mid:])

          print(f"Total strings to translate: {len(tasks)}")
          BATCH_SIZE = 100
          for idx in range(0, len(tasks), BATCH_SIZE):
              batch = tasks[idx:idx + BATCH_SIZE]
              translated = translate_batch(batch)
              for (entry, is_plural, p_idx, _), res in zip(batch, translated):
                  if is_plural:
                      entry.msgstr_plural[p_idx] = res
                  else:
                      entry.msgstr = res
              po.save(target_path)
              print(f"Translated {min(idx + BATCH_SIZE, len(tasks))}/{len(tasks)}")
              time.sleep(7)

          print("Done!")
          EOF

      - name: Check PO syntax
        run: |
          msgfmt -c -v -o /dev/null locale/he.po || echo "Warning: some format strings need manual fix"

      - name: Commit and push translation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locale/he.po
          git diff --cached --quiet || git commit -m "Add Hebrew translation (he.po)"
          git push
