name: Auto Translate to Hebrew

on:
  workflow_dispatch: # מופעל ידנית בלחיצת כפתור

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          pip install polib deep-translator

      - name: Generate and translate locale/he.po
        run: |
          python3 - << 'EOF'
          import glob
          import os
          import time
          import polib
          from deep_translator import GoogleTranslator

          pot_files = glob.glob('locale/*.pot')
          target_path = 'locale/he.po'

          if os.path.exists(target_path):
              po = polib.pofile(target_path)
          elif pot_files:
              po = polib.pofile(pot_files[0])
          else:
              # שימוש בקובץ שפה קיים כבסיס וניקוי התרגומים שלו
              po_files = [f for f in sorted(glob.glob('locale/*.po')) if not f.endswith('he.po')]
              if not po_files:
                  raise FileNotFoundError("No .pot or .po files found in locale/")
              base_file = 'locale/ar.po' if 'locale/ar.po' in po_files else po_files[0]
              po = polib.pofile(base_file)
              for e in po:
                  e.msgstr = ''
                  e.msgstr_plural = {k: '' for k in e.msgstr_plural}
                  if 'fuzzy' in e.flags:
                      e.flags.remove('fuzzy')

          # עדכון כותרות השפה לעברית
          po.metadata['Language'] = 'he'
          po.metadata['Plural-Forms'] = 'nplurals=2; plural=(n != 1);'

          translator = GoogleTranslator(source='en', target='iw')

          for i, entry in enumerate(po):
              if entry.obsolete:
                  continue
              try:
                  if entry.msgid and not entry.msgstr:
                      entry.msgstr = translator.translate(entry.msgid) or ''
                  if entry.msgid_plural:
                      if not entry.msgstr_plural.get(0):
                          entry.msgstr_plural[0] = translator.translate(entry.msgid) or ''
                      if not entry.msgstr_plural.get(1):
                          entry.msgstr_plural[1] = translator.translate(entry.msgid_plural) or ''
                  if 'fuzzy' in entry.flags:
                      entry.flags.remove('fuzzy')
              except Exception as ex:
                  print(f"Skipping entry {i} due to error: {ex}")

              if i % 50 == 0:
                  time.sleep(0.5)

          po.save(target_path)
          print(f"Saved {target_path} successfully.")
          EOF

      - name: Check PO syntax
        run: |
          msgfmt -c -v -o /dev/null locale/he.po || echo "Warning: some format strings need manual fix"

      - name: Commit and push translation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locale/he.po
          git diff --cached --quiet || git commit -m "Add auto-translated Hebrew locale (he.po)"
          git push
